<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f2">
  <title>작은 우주 · 우주 탐험 퀴즈</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8f2;
      --card: #ffffff;
      --text: #202d29;
      --muted: #758079;
      --line: #e5e9e0;
      --accent: #d3ed77;
      --accent-text: #30431a;
      --soft: #f3f5ee;
      --green: #26774d;
      --green-bg: #eaf7ed;
      --red: #bd4147;
      --red-bg: #fff0ee;
      --shadow: 0 12px 44px #263d2310;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--green); outline-offset: 4px; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    [hidden] { display: none !important; }
    .shell { width: min(100% - 40px, 536px); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 32px 0 26px; }
    .brand { display: flex; gap: 9px; align-items: center; font-weight: 800; font-size: 18px; letter-spacing: -.7px; }
    .brand-icon { width: 31px; height: 31px; }
    .header-note { font-size: 11px; color: var(--muted); letter-spacing: 1.6px; font-weight: 700; }
    .intro { position: relative; overflow: hidden; border-radius: 22px; background: #e8eedf; padding: 28px; min-height: 201px; }
    .eyebrow { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 800; letter-spacing: 1.8px; color: #58684d; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; background: #7e9a50; border-radius: 50%; }
    #page-title {
      --display-bg: #f2f6e9;
      --display-grid: #4560360b;
      --display-frame: #809567;
      --display-label: #4c643c;
      position: relative; z-index: 1; display: flex; flex-direction: column; gap: 11px;
      width: fit-content; max-width: 100%; margin: 17px 0 15px; padding: 15px 18px;
      border: 1px solid var(--display-frame); border-left: 3px solid var(--display-label);
      border-radius: 2px; background-color: var(--display-bg);
      background-image: linear-gradient(var(--display-grid) 1px, transparent 1px), linear-gradient(90deg, var(--display-grid) 1px, transparent 1px);
      background-size: 16px 16px; color: var(--text);
      font-size: 26px; line-height: 1.45; letter-spacing: -.8px; font-weight: 750;
    }
    #page-title::before, #page-title::after {
      content: ""; position: absolute; width: 8px; height: 8px;
      border-color: var(--display-label); border-style: solid; pointer-events: none;
    }
    #page-title::before { top: -4px; left: -6px; border-width: 2px 0 0 2px; }
    #page-title::after { bottom: -4px; right: -4px; border-width: 0 2px 2px 0; }
    .mission-readout {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding-bottom: 8px; border-bottom: 1px solid var(--display-frame);
      color: var(--display-label); font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 10px; line-height: 1.5; font-weight: 600; letter-spacing: .7px;
    }
    .mission-ready { display: inline-flex; align-items: center; gap: 5px; }
    .mission-ready::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .intro p { position: relative; z-index: 1; color: #66735e; margin: 0; font-size: 13px; }
    .space-art { position: absolute; right: -16px; top: 13px; width: 238px; height: 186px; pointer-events: none; }
    .planet { transform-origin: 142px 90px; animation: float 7s ease-in-out infinite; }
    .mission-meta { display: flex; gap: 17px; align-items: center; padding: 17px 3px 22px; color: var(--muted); font-size: 12px; }
    .mission-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .mission-meta svg { width: 14px; height: 14px; }
    .mission-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: #bdc5b6; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 27px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .question-count { font-size: 12px; color: var(--muted); }
    .question-count strong { color: var(--text); font-size: 15px; }
    .score { display: flex; align-items: center; gap: 6px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
    .score svg { width: 14px; height: 14px; color: #8b9e4b; }
    .score strong { color: var(--text); }
    .score.bump { animation: pop .4s ease; }
    .progress { height: 5px; border-radius: 5px; background: var(--soft); margin: 16px 0 25px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: #a8ca56; border-radius: inherit; transition: width .5s ease; }
    .category { display: inline-block; background: var(--soft); color: #74835d; font-size: 10px; font-weight: 700; border-radius: 5px; padding: 3px 8px; letter-spacing: .2px; }
    h2 { font-size: 23px; line-height: 1.5; letter-spacing: -.9px; margin: 12px 0 7px; font-weight: 750; word-break: keep-all; }
    .hint { margin: 0 0 22px; font-size: 12px; color: var(--muted); }
    .answers { display: grid; gap: 10px; }
    .answer {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 14px;
      text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 11px;
      color: var(--text); transition: border-color .18s, background .18s, transform .18s; min-height: 53px;
    }
    .answer:not(:disabled):hover { background: var(--soft); border-color: #b2c28e; transform: translateX(3px); }
    .letter { width: 25px; height: 25px; border: 1px solid var(--line); border-radius: 7px; display: grid; place-items: center; font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .answer-text { flex: 1; font-size: 14px; font-weight: 500; }
    .answer-mark { font-weight: 800; font-size: 18px; width: 20px; text-align: center; }
    .answer.correct { background: var(--green-bg); border-color: #7aba8d; color: var(--green); animation: correct-glow .55s ease; }
    .answer.correct .letter { color: var(--green); border-color: #badfc3; background: var(--green-bg); }
    .answer.wrong { background: var(--red-bg); border-color: #e18d8d; color: var(--red); animation: shake .42s ease; }
    .answer.wrong .letter { color: var(--red); border-color: #efc2bf; }
    .answer.subdued { opacity: .48; }
    .feedback { border-radius: 10px; padding: 13px 15px; margin-top: 16px; font-size: 13px; animation: enter .25s ease; }
    .feedback.good { background: var(--green-bg); color: var(--green); }
    .feedback.bad { background: var(--red-bg); color: var(--red); }
    .feedback strong { display: block; margin-bottom: 3px; font-size: 14px; }
    .feedback p { margin: 0; line-height: 1.7; }
    .next { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; background: var(--accent); color: var(--accent-text); border-radius: 10px; font-size: 13px; font-weight: 750; padding: 14px; margin-top: 23px; transition: filter .2s, transform .2s; }
    .next:not(:disabled):hover { filter: brightness(.95); transform: translateY(-1px); }
    .next:disabled { background: var(--soft); color: var(--muted); }
    .next svg { width: 15px; height: 15px; }
    .keyboard-note { text-align: center; font-size: 11px; color: var(--muted); margin: 13px 0 0; }
    kbd { font-family: inherit; font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
    .bottom-note { text-align: center; color: var(--muted); font-size: 12px; margin: 23px 0 0; }
    .bottom-note span { margin-right: 5px; color: #8c9d6c; }
    footer { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 10px; letter-spacing: 1.2px; color: var(--muted); padding: 28px 0; }
    footer::before, footer::after { content: ""; background: var(--line); height: 1px; width: 28px; }
    .question-panel { animation: enter .3s ease; }
    .results { text-align: center; animation: enter .4s ease; padding-top: 7px; }
    .result-emoji { display: grid; place-items: center; width: 90px; height: 90px; background: var(--soft); border-radius: 50%; font-size: 46px; margin: 8px auto 20px; animation: pop .65s ease; }
    .results h2 { font-size: 27px; margin-top: 14px; }
    .result-copy { color: var(--muted); font-size: 14px; word-break: keep-all; }
    .result-total { font-size: 62px; letter-spacing: -3px; font-weight: 800; line-height: 1.3; margin-top: 22px; }
    .result-total span { font-size: 22px; color: var(--muted); letter-spacing: -1px; font-weight: 500; }
    .result-label { color: var(--muted); font-size: 12px; margin: 0; }
    .result-dots { display: flex; justify-content: center; gap: 7px; margin: 22px 0; }
    .result-dot { width: 25px; height: 25px; display: grid; place-items: center; background: var(--green-bg); color: var(--green); border-radius: 7px; font-size: 12px; }
    .result-dot.missed { background: var(--red-bg); color: var(--red); }
    .result-summary { border-top: 1px solid var(--line); padding-top: 17px; font-size: 13px; color: var(--muted); }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
    @keyframes pop { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.13); } }
    @keyframes correct-glow { 50% { box-shadow: 0 0 0 4px #7aba8d33; } }
    @keyframes enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171d1b; --card: #202824; --text: #edf1e7; --muted: #a0ada2; --line: #354039; --soft: #2a342d; --green: #a1dfb3; --green-bg: #253e2e; --red: #ffa8a5; --red-bg: #452c2c; --shadow: 0 12px 44px #0002; }
      .intro { background: #2c392b; }
      #page-title { --display-bg: #202d23; --display-grid: #b9df9510; --display-frame: #6b8459; --display-label: #c3e58f; }
      .eyebrow, .intro p { color: #b1c29e; }
      .category { color: #bbce98; }
      .space-art { opacity: .88; }
      .progress-fill { background: #b7d76b; }
    }
    @media (max-width: 420px) {
      .shell { width: calc(100% - 28px); }
      header { padding-top: 23px; }
      .intro { padding: 23px; min-height: 190px; }
      #page-title { font-size: 23px; padding: 13px 14px; }
      .space-art { width: 192px; right: -35px; top: 25px; opacity: .65; }
      .intro p { font-size: 12px; }
      .card { padding: 21px; }
      h2 { font-size: 21px; }
      .result-dots { gap: 5px; }
      .result-dot { width: 23px; height: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <circle cx="18" cy="18" r="10" fill="#cce580"/>
          <ellipse cx="18" cy="18" rx="17" ry="5.8" transform="rotate(-30 18 18)" stroke="currentColor" stroke-width="1.6"/>
          <path d="M28 3v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        작은 우주
      </div>
      <span class="header-note">A LITTLE SPACE, A BIG DISCOVERY</span>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow">SPACE EXPLORER QUIZ</div>
        <h1 id="page-title">
          <span class="mission-readout" aria-hidden="true"><span>MISSION 01</span><span class="mission-ready">탐사 준비</span></span>
          <span>당신의 우주는<br>어디까지인가요?</span>
        </h1>
        <p>호기심 하나면 충분해요.<br>10개의 질문으로 떠나는 작은 우주 여행.</p>
        <svg class="space-art" viewBox="0 0 260 200" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="planet" x1="102" y1="44" x2="183" y2="143" gradientUnits="userSpaceOnUse">
              <stop stop-color="#e8a46c"/><stop offset="1" stop-color="#c26c43"/>
            </linearGradient>
            <clipPath id="planet-clip"><circle cx="151" cy="100" r="48"/></clipPath>
          </defs>
          <ellipse cx="151" cy="103" rx="105" ry="71" transform="rotate(-28 151 103)" stroke="#b8c6a6" stroke-dasharray="3 6" opacity=".6"/>
          <g class="planet">
            <circle cx="151" cy="100" r="48" fill="url(#planet)"/>
            <g clip-path="url(#planet-clip)" stroke="#f3c29a" stroke-width="9" opacity=".32">
              <path d="M100 66c35 23 63-6 105 14M93 91c45 28 76-4 118 19M103 119c36 23 66 2 92 20"/>
            </g>
            <path d="M108 81c-40 25-49 44-37 50 20 13 91-7 142-39 27-16 34-29 23-34-6-3-18-2-35 2" stroke="#eed7a6" stroke-width="12" stroke-linecap="round"/>
            <path d="M108 81c-40 25-49 44-37 50 20 13 91-7 142-39 27-16 34-29 23-34-6-3-18-2-35 2" stroke="#c49a60" stroke-opacity=".35" stroke-width="2"/>
          </g>
          <path d="M74 33v12m-6-6h12M219 150v10m-5-5h10" stroke="#718460" stroke-width="1.6" stroke-linecap="round"/>
          <path d="m202 20 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#8a9d6d"/>
          <circle cx="51" cy="107" r="3" fill="#9aad7c"/><circle cx="125" cy="170" r="2.5" fill="#9aad7c"/>
          <circle cx="243" cy="118" r="2" fill="#9aad7c"/><circle cx="107" cy="22" r="1.5" fill="#9aad7c"/>
        </svg>
      </section>

      <div class="mission-meta">
        <span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="3" width="12" height="15" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.4"/></svg>총 10문항</span>
        <i class="dot" aria-hidden="true"></i>
        <span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M10 5v5l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>약 3분</span>
        <i class="dot" aria-hidden="true"></i>
        <span>누구나 도전 가능</span>
      </div>

      <section class="card" aria-label="우주 탐험 퀴즈">
        <div class="status-row">
          <div class="question-count" id="question-count"><strong>01</strong> / 10</div>
          <div class="score" id="score-badge" role="status" aria-label="현재 점수 0점">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m10 2 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4L2.2 7.7l5.4-.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <strong id="score">0</strong>점
          </div>
        </div>
        <div class="progress" id="progress" role="progressbar" aria-label="퀴즈 진행률" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div id="quiz" class="question-panel">
          <span class="category" id="category"></span>
          <h2 id="question" tabindex="-1"></h2>
          <p class="hint">정답이라고 생각하는 하나를 골라주세요.</p>
          <div class="answers" id="answers" role="group" aria-labelledby="question"></div>
          <div id="feedback" class="feedback" role="status" hidden></div>
          <button class="next" id="next" disabled>
            <span id="next-label">답을 선택해주세요</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <p class="keyboard-note"><kbd>1</kbd> – <kbd>4</kbd> 로 선택 · <kbd>Enter</kbd> 로 다음 질문</p>
        </div>

        <div id="results" class="results" hidden>
          <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
          <span class="category">MISSION COMPLETE</span>
          <h2 id="result-title" tabindex="-1"></h2>
          <p class="result-copy" id="result-copy"></p>
          <div class="result-total" id="result-total"></div>
          <p class="result-label">이번 탐험에서 얻은 점수</p>
          <div class="result-dots" id="result-dots" aria-label="문항별 결과"></div>
          <p class="result-summary" id="result-summary"></p>
          <button class="next" id="restart">다시 탐험하기 <span aria-hidden="true">↗</span></button>
        </div>
      </section>
      <p class="bottom-note"><span aria-hidden="true">✧</span> 몰라도 괜찮아요. 발견하는 게 여행이니까요.</p>
    </main>
    <footer>KEEP LOOKING UP</footer>
  </div>
  <script>
    "use strict";
    const questions = [
      { category: "달 탐사", question: "인류가 처음 달에 발을 내디딘 해는 언제일까요?", answers: ["1965년", "1969년", "1972년", "1981년"], correct: 1, explanation: "1969년 7월, 아폴로 11호의 닐 암스트롱과 버즈 올드린이 인류 최초로 달 표면을 걸었어요." },
      { category: "태양계", question: "‘붉은 행성’이라는 별명을 가진 행성은?", answers: ["금성", "목성", "화성", "수성"], correct: 2, explanation: "화성 표면에는 산화철, 즉 녹이 많이 있어요. 이 때문에 붉은빛을 띤답니다." },
      { category: "우주 개척", question: "인류 최초로 우주에 간 사람은 누구일까요?", answers: ["유리 가가린", "닐 암스트롱", "앨런 셰퍼드", "존 글렌"], correct: 0, explanation: "유리 가가린은 1961년 4월 12일 보스토크 1호를 타고 지구를 한 바퀴 돌았어요." },
      { category: "우주 탐사선", question: "지구에서 가장 멀리 떠난 인류의 탐사선은?", answers: ["주노", "뉴 허라이즌스", "보이저 2호", "보이저 1호"], correct: 3, explanation: "1977년에 출발한 보이저 1호는 2012년 태양권을 벗어나 성간 공간에 진입했어요. 지금도 지구에서 멀어지고 있죠." },
      { category: "태양계", question: "태양계에서 가장 큰 행성은 무엇일까요?", answers: ["토성", "해왕성", "목성", "천왕성"], correct: 2, explanation: "목성은 지름이 지구의 약 11배인 거대한 가스 행성이에요. 질량은 지구의 약 318배랍니다." },
      { category: "우주 생활", question: "국제우주정거장(ISS)은 주로 어디를 돌고 있을까요?", answers: ["달 주변", "지구 주변", "화성 주변", "태양과 지구 사이의 한 지점"], correct: 1, explanation: "ISS는 지상 약 400km 높이의 지구 저궤도를 돌아요. 약 90분마다 지구를 한 바퀴 돈답니다." },
      { category: "화성 탐사", question: "2021년 화성에 착륙해 생명체의 흔적을 찾는 NASA 로버는?", answers: ["퍼서비어런스", "보이저", "스피릿", "소저너"], correct: 0, explanation: "퍼서비어런스는 2021년 예제로 충돌구에 착륙했어요. 고대 미생물의 흔적을 찾고 암석 시료를 수집하고 있죠." },
      { category: "우주 망원경", question: "제임스 웹 우주 망원경은 주로 어떤 빛으로 우주를 관측할까요?", answers: ["감마선", "자외선", "엑스선", "적외선"], correct: 3, explanation: "제임스 웹은 주로 적외선을 관측해요. 멀리 있는 초기 은하와 먼지 속에서 태어나는 별을 살펴볼 수 있답니다." },
      { category: "우리의 달", question: "지구에서 달의 같은 면이 주로 보이는 이유는?", answers: ["달이 전혀 자전하지 않아서", "지구의 그림자가 달을 가려서", "달의 자전 주기와 공전 주기가 같아서", "달의 한쪽 면에서만 빛이 나서"], correct: 2, explanation: "달은 지구를 한 바퀴 도는 동안 스스로도 한 바퀴 돌아요. 이런 ‘동주기 자전’ 덕분에 지구에서는 거의 같은 면을 보게 돼요." },
      { category: "다음 목적지", question: "아르테미스 계획이 유인 탐사의 주요 목적지로 삼는 곳은?", answers: ["목성의 대적점", "달의 남극 지역", "금성의 표면", "토성의 고리"], correct: 1, explanation: "아르테미스 계획은 달 남극 지역의 유인 탐사를 목표로 해요. 이 지역의 영구 음영에는 물 얼음이 있어 미래 탐사의 중요한 자원이 될 수 있답니다." }
    ];
    const $ = (id) => document.getElementById(id);
    let current = 0;
    let score = 0;
    let answered = false;
    let finished = false;
    let outcomes = [];

    function updateProgress(completed) {
      $("progress-fill").style.width = `${completed / questions.length * 100}%`;
      $("progress").setAttribute("aria-valuenow", completed);
      $("progress").setAttribute("aria-valuetext", `10문항 중 ${completed}문항 완료`);
    }

    function renderQuestion(focus = false) {
      const item = questions[current];
      answered = false;
      $("question-count").innerHTML = `<strong>${String(current + 1).padStart(2, "0")}</strong> / 10`;
      $("category").textContent = item.category;
      $("question").textContent = item.question;
      $("feedback").hidden = true;
      $("feedback").replaceChildren();
      $("next").disabled = true;
      $("next-label").textContent = "답을 선택해주세요";
      $("answers").replaceChildren();
      item.answers.forEach((text, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = String.fromCharCode(65 + index);
        letter.setAttribute("aria-hidden", "true");
        const label = document.createElement("span");
        label.className = "answer-text";
        label.textContent = text;
        const mark = document.createElement("span");
        mark.className = "answer-mark";
        mark.setAttribute("aria-hidden", "true");
        button.append(letter, label, mark);
        button.addEventListener("click", () => choose(index));
        $("answers").append(button);
      });
      $("quiz").getAnimations().forEach((animation) => animation.cancel());
      $("quiz").animate([{ opacity: 0, transform: "translateY(7px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 250 });
      if (focus) $("question").focus({ preventScroll: true });
    }

    function choose(index) {
      if (answered || finished) return;
      answered = true;
      const item = questions[current];
      const correct = index === item.correct;
      outcomes.push(correct);
      if (correct) {
        score += 10;
        $("score").textContent = score;
        $("score-badge").setAttribute("aria-label", `현재 점수 ${score}점`);
        $("score-badge").classList.remove("bump");
        void $("score-badge").offsetWidth;
        $("score-badge").classList.add("bump");
      }
      Array.from($("answers").children).forEach((button, i) => {
        button.disabled = true;
        if (i === item.correct) {
          button.classList.add("correct");
          button.querySelector(".answer-mark").textContent = "✓";
          button.setAttribute("aria-label", `${item.answers[i]}, 정답`);
        } else if (i === index) {
          button.classList.add("wrong");
          button.querySelector(".answer-mark").textContent = "×";
          button.setAttribute("aria-label", `${item.answers[i]}, 선택한 답, 오답`);
        } else {
          button.classList.add("subdued");
        }
      });
      $("feedback").className = `feedback ${correct ? "good" : "bad"}`;
      const heading = document.createElement("strong");
      heading.textContent = correct ? "정답이에요! 멋진 발견이에요 ✨" : "아쉽지만 괜찮아요. 하나 더 배웠네요!";
      const explanation = document.createElement("p");
      explanation.textContent = item.explanation;
      $("feedback").append(heading, explanation);
      $("feedback").hidden = false;
      $("next").disabled = false;
      $("next-label").textContent = current === questions.length - 1 ? "탐험 결과 보기" : "다음 질문";
      updateProgress(current + 1);
      $("next").focus({ preventScroll: true });
    }

    function advance() {
      if (!answered || finished) return;
      if (current < questions.length - 1) {
        current++;
        renderQuestion(true);
      } else {
        showResults();
      }
    }

    function showResults() {
      finished = true;
      $("quiz").hidden = true;
      $("results").hidden = false;
      $("question-count").textContent = "탐험 완료!";
      const reaction = score >= 80
        ? { emoji: "🧑‍🚀", title: "당신은 타고난 우주 탐험가!", copy: "우주를 향한 호기심이 반짝이는 지식이 되었네요." }
        : score >= 50
          ? { emoji: "🚀", title: "멋진 여정이었어요!", copy: "우주 탐험가로 한 걸음 더 가까워졌어요." }
          : { emoji: "🌱", title: "호기심의 씨앗을 심었어요!", copy: "모든 탐험은 작은 발견에서 시작돼요. 이제 더 많이 알게 되었네요." };
      $("result-emoji").textContent = reaction.emoji;
      $("result-title").textContent = reaction.title;
      $("result-copy").textContent = reaction.copy;
      $("result-total").innerHTML = `${score}<span> / 100</span>`;
      $("result-summary").textContent = `10문항 중 ${score / 10}문항 정답 · 정답률 ${score}%`;
      $("result-dots").replaceChildren();
      outcomes.forEach((correct, index) => {
        const dot = document.createElement("span");
        dot.className = `result-dot${correct ? "" : " missed"}`;
        dot.textContent = correct ? "✓" : "×";
        dot.setAttribute("aria-label", `${index + 1}번 ${correct ? "정답" : "오답"}`);
        dot.title = `${index + 1}번: ${correct ? "정답" : "오답"}`;
        $("result-dots").append(dot);
      });
      $("result-title").focus({ preventScroll: true });
    }

    $("next").addEventListener("click", advance);
    $("restart").addEventListener("click", () => {
      current = 0;
      score = 0;
      outcomes = [];
      finished = false;
      $("score").textContent = "0";
      $("score-badge").setAttribute("aria-label", "현재 점수 0점");
      $("score-badge").classList.remove("bump");
      $("results").hidden = true;
      $("quiz").hidden = false;
      updateProgress(0);
      renderQuestion(true);
    });
    document.addEventListener("keydown", (event) => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.repeat || finished) return;
      if (/^[1-4]$/.test(event.key) && !answered) {
        event.preventDefault();
        choose(Number(event.key) - 1);
      } else if (event.key === "Enter" && answered) {
        event.preventDefault();
        advance();
      }
    });
    updateProgress(0);
    renderQuestion();
  </script>
</body>
</html>
